<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Optimisation iPhone 13 : gestion de l'encoche (viewport-fit=cover) et blocage du zoom accidentel -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Configuration Web App iOS (Écran d'accueil) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Calendrier">
    <link rel="apple-touch-icon" href="assets/icon.png">
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FAF8F5">

    <title>Calendrier de l'Avent</title>

    <!-- Typographies sobres : Cormorant Garamond (Titres/Chiffres) & Inter (Texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <header class="header">
            <span class="subtitle">Décembre</span>
            <h1 class="title">En attendant Noël</h1>
            <p class="progress-text" id="progress-text">0 sur 24 découverts</p>
        </header>

        <!-- Grille des 24 jours générée par JS -->
        <section class="calendar-grid" id="calendar-grid"></section>
    </main>

    <!-- Fenêtre modale (tiroir bas style iOS) pour afficher le contenu d'une case -->
    <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <button class="modal-close" id="modal-close" aria-label="Fermer">&times;</button>
            <div class="modal-content">
                <span class="modal-day" id="modal-day">Jour 1</span>
                <h2 class="modal-title" id="modal-title">Titre du jour</h2>
                <div class="modal-body" id="modal-body">Contenu du jour...</div>
            </div>
        </div>
    </div>

    <!-- Notification discrète si la case est encore verrouillée -->
    <div class="toast" id="toast">Patience...</div>

    <script src="script.js"></script>
</body>
</html>
